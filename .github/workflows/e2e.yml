name: E2E

# Maestro の E2E は 1 回 20〜45 分かかるので、既存の ci.yml のように毎 PR では回さない。
#   - PR       … `e2e` ラベルが付いているときだけ smoke（00/01/02）
#   - main     … マージ後に manual 以外の全フロー
#   - 手動      … workflow_dispatch で範囲を選ぶ（ネイティブを触ったときの主経路）
# cron は入れていない。依存は package-lock.json と plugin/src/core/versions.ts で
# ピン留めされていて、コミットが無いのに壊れる要素はランナーイメージの更新くらいしかない。
# しかも ~/.cache/expo-voicevox が効いている限り上流アセットの取得経路は再検証されないので、
# 定期実行しても「上流から消えた」は検知できない。
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      scope:
        description: 回すフローの範囲
        type: choice
        options: [full, smoke]
        default: full

# ci.yml とはグループを分ける。共有すると E2E のキャンセルが lint まで巻き込む。
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  # 固定しないと「cron を入れなくても外的ドリフトが無い」という前提が崩れる。
  # CLAUDE.md の「Maestro 2.8.0 / Java 17」と揃えること。
  MAESTRO_VERSION: 2.8.0

jobs:
  # 端末が要らない構文チェックだけは、ラベルに関係なく全 PR で回す。
  lint:
    name: check-syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # maestro は JVM アプリなので check-syntax にも Java が要る。
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # node_modules は要らない（maestro を直接叩くだけ）ので npm ci は省く。
      - run: npm run e2e:lint

  # 回すフローの範囲は android と ios で同じ。ジョブごとに書くと片方だけ直して食い違うので、
  # 1 か所で決めて outputs で配る。PR の `e2e` ラベルによる出し分けもここへ集約してある。
  # このジョブが skip されれば、needs で繋がった端末ジョブもまとめて skip される。
  # ラベルが無い PR では skip されるので、端末ジョブを required status check にしては
  # いけない（永久に pending になる）。
  scope:
    name: resolve-scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'e2e')
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
      args: ${{ steps.scope.outputs.args }}
    steps:
      - name: Resolve the flow scope
        id: scope
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            scope=smoke
          else
            scope="${{ inputs.scope || 'full' }}"
          fi
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          # full のときは引数なし。.maestro/config.ci.yaml の excludeTags が manual を外す。
          if [ "$scope" = "smoke" ]; then
            echo "args=--include-tags smoke" >> "$GITHUB_OUTPUT"
          else
            echo "args=" >> "$GITHUB_OUTPUT"
          fi
          echo "### E2E scope: \`$scope\`" >> "$GITHUB_STEP_SUMMARY"

  android:
    name: Maestro (Android)
    # Android のエミュレータは x86_64 のまま。arm64 にはできない
    # （Linux arm64 ランナーには /dev/kvm が無く、macOS ランナーは VM の中なので
    # ネスト仮想化が使えず HVF が HV_UNSUPPORTED で落ちる）。実機に近い arm64 の
    # 検証は ios ジョブ（macOS ランナーは Apple Silicon）が担う。
    runs-on: ubuntu-latest
    needs: scope
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            example/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5

      # ci.yml の android ジョブと同一のキー。runner.os が同じ Linux なので、
      # 先に走ったほうが温めたキャッシュをそのまま拾える。
      - name: Cache voicevox-core artifacts
        uses: actions/cache@v6
        with:
          path: ~/.cache/expo-voicevox
          key: >-
            voicevox-${{ runner.os }}-${{ hashFiles('plugin/src/core/versions.ts',
            'plugin/src/core/artifacts.generated.ts', 'example/app.json') }}

      # prepare が plugin/build/withVoicevox を作るので prebuild より先に必要。
      - run: npm ci

      - name: Install example dependencies
        run: npm ci
        working-directory: example

      - name: Prebuild the example app (Android)
        run: npx expo prebuild --platform android --no-install
        working-directory: example

      # エミュレータは x86_64 なので ABI を 1 つに絞る（既定は arm64-v8a,x86_64）。
      # NDK のビルド時間と APK サイズがおおよそ半分になる。
      # assembleRelease は JS バンドルを APK に焼くので Metro は要らず、
      # release も signingConfigs.debug を使うので keystore の用意も要らない。
      - name: Build the release APK
        run: ./gradlew :app:assembleRelease -PreactNativeArchitectures=x86_64 --console=plain
        working-directory: example/android

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # これが無いとエミュレータがソフトウェアエミュレーションになり、合成が現実的な時間で終わらない。
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cache the AVD snapshot
        uses: actions/cache@v6
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          # AVD は ram-size / cores を焼き込んで作られる。変えたらこのキーも変えること。
          key: avd-34-google_apis-x86_64-ram6144-cores3

      # キャッシュが無いときだけ、空のフローで 1 度起動してスナップショットを作る。
      # ここは音を鳴らさないので -noaudio でよい。
      - name: Create the AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 3
          ram-size: 6144M
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated the AVD snapshot."

      # ランナーにサウンドデバイスが無いままだと 02-synthesis が
      # 「Assertion is false: .*#\d+ started.*, id: speech-state」で落ちる。JS 側は
      # 「再生中」まで進むのに、ネイティブの再生器が started を観測させないまま終わる。
      #
      # 紛らわしいが、このシンクを立てても emulator の
      # 「Could not init `pa` audio driver」は消えない。メッセージは無視してよく、
      # 見るべきは 02-synthesis が通るかどうか（入れると通り、外すと落ちるのを確認済み）。
      - name: Start a dummy PulseAudio sink
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=dummy

      # 音が鳴ったかどうかは speech-state（ネイティブの再生器が出すイベント）で見ている。
      # このアクションの emulator-options の既定値には -noaudio が入っているので、
      # 明示的に上書きして音声デバイスを残すこと。
      # 殺すと 02-synthesis の検証が意味を失う。
      - name: Run the Maestro flows
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 3
          ram-size: 6144M
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none
          disable-animations: true
          # hide_error_dialogs を立てないと「Pixel Launcher isn`t responding」の ANR ダイアログが
          # 最前面を占有し、アプリは正常なのに Maestro が lib-version を見つけられず
          # 全フローが launch の 120 秒待ちで落ちる（full スイートで実際に 9/9 失敗した）。
          #
          # 200MB の APK を入れた直後は PackageManager の dexopt でエミュレータが忙しく、
          # スナップショットから復元した直後の adb が「device offline」で一瞬落ちる。
          # 実際 00-assets と 01-initialize が launchApp の時点で
          # DeviceServerDiedException を踏んだ。install のあとに落ち着くまで待つこと。
          #
          # 行末のバックスラッシュで継続してはいけない。このアクションは script を
          # @actions/exec の引数分割に通すので、\ がそのまま引数として渡り
          # 「Flow path does not exist: .../\」で落ちる。1 コマンド 1 行で書くこと。
          script: |
            adb install -r example/android/app/build/outputs/apk/release/app-release.apk
            adb wait-for-device
            adb shell settings put global hide_error_dialogs 1
            adb shell settings get global hide_error_dialogs
            sleep 60
            adb wait-for-device
            maestro test --config .maestro/config.ci.yaml ${{ needs.scope.outputs.args }} --format junit --output maestro-report.xml --debug-output .maestro/output --flatten-debug-output .maestro

      # --debug-output を明示しているので、スクリーンショットとログはここに集まる
      # （既定の ~/.maestro/tests/{timestamp}/ はランナーから拾いにくい）。
      - name: Upload the Maestro artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-android-${{ needs.scope.outputs.scope }}
          path: |
            .maestro/output
            maestro-report.xml
          if-no-files-found: ignore

  ios:
    name: Maestro (iOS)
    # macOS ランナーは Apple Silicon（arm64）で、public リポジトリなら無料・無制限で使える。
    # シミュレータは仮想化を使わないので、Android エミュレータを arm64 で回せない理由
    # （macOS ランナーは VM の中で HVF が HV_UNSUPPORTED になる）には当たらない。
    #
    # macos-15 は使えない。既定の Xcode が Swift 6.1 で、ExpoModulesJSI の
    # xcframework を組む SwiftPM が「package 'apple' is using Swift tools version
    # 6.2.0 but the installed version is 6.1.0」で止まる。macos-26 は既定が Xcode 26.6。
    runs-on: macos-26
    needs: scope
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            example/package-lock.json

      # maestro は JVM アプリなので iOS 側にも Java が要る。
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 中身は android ジョブと同じだが runner.os が macOS なのでキーは別物。
      # iOS はモデルと辞書をフォルダ参照で .app に載せるため、prebuild より先に要る。
      - name: Cache voicevox-core artifacts
        uses: actions/cache@v6
        with:
          path: ~/.cache/expo-voicevox
          key: >-
            voicevox-${{ runner.os }}-${{ hashFiles('plugin/src/core/versions.ts',
            'plugin/src/core/artifacts.generated.ts', 'example/app.json') }}

      # prepare が plugin/build/withVoicevox を作るので prebuild より先に必要。
      - run: npm ci

      - name: Install example dependencies
        run: npm ci
        working-directory: example

      # Swift のバージョン不足はビルドの終盤まで分からないので、最初に控えておく。
      - name: Show the toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Prebuild the example app (iOS)
        run: npx expo prebuild --platform ios --no-install
        working-directory: example

      # --no-install は npm と CocoaPods の両方を飛ばすので pod install は自分で呼ぶ。
      # example に Gemfile は無いので bundle exec は要らない（CocoaPods はランナー同梱）。
      - name: Install the CocoaPods dependencies
        run: pod install
        working-directory: example/ios

      # Release で焼く。Debug は LogBox がタップを吸ううえ Metro が要る（.maestro/README.md）。
      # Release のビルドフェーズが JS バンドルを .app に埋めるので Metro は不要。
      # 署名は要らない（simctl install はシミュレータ向けの .app をそのまま受け取る）。
      - name: Build the app for the simulator
        run: |
          xcodebuild -workspace expovoicevoxexample.xcworkspace \
            -scheme expovoicevoxexample \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
        working-directory: example/ios

      # iOS は Android と違って実行時の展開が無く、.app の中をそのまま読む。
      # 構造ごと入っていなければ 00-assets ではなく起動直後に落ちるので、ここで先に落とす。
      - name: Verify that the assets landed in the app bundle
        run: find example/ios/build/Build/Products/Release-iphonesimulator/*.app/voicevox -maxdepth 1

      # シミュレータの再生はホスト macOS の CoreAudio に出る。ランナーイメージの
      # Null Audio Device は起動時の初期化に失敗することが 3 割ほどあり
      # （actions/runner-images#13668）、出力デバイスが 1 つも無いと
      # AVAudioPlayer.play() が false を返して 02-synthesis が
      # 「could not start the audio player」で落ちる。Android 側の module-null-sink と同じ役目。
      #
      # BlackHole の追加インストールは再起動しないと効かない（runner-images#11746）ので、
      # 既にイメージへ入っているデバイスを coreaudiod の再起動で拾い直す。
      - name: Ensure a host audio output device
        run: |
          if ! system_profiler SPAudioDataType | grep -qi output; then
            echo "no audio output device; restarting coreaudiod."
            sudo killall coreaudiod || true
            for _ in 1 2 3 4 5 6; do
              sleep 5
              system_profiler SPAudioDataType | grep -qi output && break
            done
          fi
          system_profiler SPAudioDataType || true

      # 端末名はランナーイメージの Xcode に紐づいて変わるので固定しない。
      # 使えるランタイムのうち新しいほうから iPhone を 1 台選ぶ。
      - name: Boot the simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available --json \
            | jq -r '.devices | to_entries
                | map(select(.key | test("SimRuntime[.]iOS")))
                | sort_by(.key) | last | .value
                | map(select(.name | test("^iPhone"))) | last | .udid')
          if [ -z "$udid" ] || [ "$udid" = "null" ]; then
            echo "no iPhone simulator is available." >&2
            xcrun simctl list devices available >&2
            exit 1
          fi
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          # 既に起動していると boot は「Unable to boot device in current state」で失敗する。
          # 起動できたかどうかの判定は後段の bootstatus に任せる。
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl list devices booted

      - name: Install the app on the simulator
        run: |
          xcrun simctl install "${{ steps.sim.outputs.udid }}" \
            example/ios/build/Build/Products/Release-iphonesimulator/expovoicevoxexample.app

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # 起動しているのはこの 1 台だけなので --platform ios で足りる（npm run e2e:ios と同じ形）。
      - name: Run the Maestro flows
        run: |
          maestro test --platform ios \
            --config .maestro/config.ci.yaml ${{ needs.scope.outputs.args }} \
            --format junit --output maestro-report.xml \
            --debug-output .maestro/output --flatten-debug-output .maestro

      - name: Upload the Maestro artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-ios-${{ needs.scope.outputs.scope }}
          path: |
            .maestro/output
            maestro-report.xml
          if-no-files-found: ignore
