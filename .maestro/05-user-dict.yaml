# ユーザー辞書。
#
# setUserDictWords() は全置換なので、画面のリストがそのまま辞書の中身になる。
# initialize() の前でも呼べることも確かめる。
#
# iOS のシミュレータには日本語を送り込めないので、日本語の語は「例を入れる」
# ボタンから入れる。inputText 自体は ASCII の語で 1 回だけ通しておく。
appId: expo.modules.voicevox.example
name: 05-user-dict
tags:
  - feature
---
- runFlow: subflows/launch.yaml

- scrollUntilVisible:
    element:
      id: 'btn-dict-fill-sample'
    direction: DOWN
    centerElement: true
    speed: 30
    timeout: 120000
- tapOn:
    id: 'btn-dict-fill-sample'
- tapOn:
    id: 'btn-dict-add'
- runFlow: subflows/wait-idle.yaml
- assertVisible:
    id: 'status-text'
    text: '.*ユーザー辞書を更新しました（1 語）.*'
- assertVisible:
    id: 'dict-word-0'
    text: '.*四国めたん → シコクメタン.*'

# 2 語目。登録に成功すると入力欄は空に戻るので、表記と読みの両方を入れ直す。
# 読みは全角カタカナしか受け付けず、iOS のシミュレータには日本語を送り込めない
# ので「例を入れる」で埋め、表記だけ ASCII に差し替える。
- scrollUntilVisible:
    element:
      id: 'btn-dict-fill-sample'
    direction: DOWN
    centerElement: true
    speed: 30
    timeout: 120000
- tapOn:
    id: 'btn-dict-fill-sample'

# 品詞と優先度は、キーボードを出す前に変えておく。入力欄に触れるとキーボードが
# 画面の下半分を覆い、その下にある Stepper はタップが吸われて反応しない。
# 品詞のチップは「例を入れる」より上にあるので、戻る向きに探す。
- scrollUntilVisible:
    element:
      id: 'wordtype-chip-COMMON_NOUN'
    direction: UP
    centerElement: true
    speed: 30
    timeout: 120000
- tapOn:
    id: 'wordtype-chip-COMMON_NOUN'
# 押せたことをその場で確かめる。Chip には accessibilityState を付けてあるので
# 選択されているかどうかを見られる。
- assertVisible:
    id: 'wordtype-chip-COMMON_NOUN'
    selected: true
- scrollUntilVisible:
    element:
      id: 'dict-priority-value'
    direction: DOWN
    centerElement: true
    speed: 30
    timeout: 120000
- assertVisible:
    id: 'dict-priority-value'
    text: '5'
- tapOn:
    id: 'dict-priority-plus'
- assertVisible:
    id: 'dict-priority-value'
    text: '6'

# ここだけ inputText を通して、キーボードからの入力経路も確かめておく。
- scrollUntilVisible:
    element:
      id: 'input-dict-surface'
    direction: UP
    centerElement: true
    speed: 30
    timeout: 120000
- tapOn:
    id: 'input-dict-surface'
# eraseText は既定だと消す文字数が足りず「四国めたん」が残る。多めに指定する。
- eraseText: 50
- inputText: 'VOICEVOX'
# 入力欄は単一行なので Return で blur してキーボードが畳まれる。閉じないと
# initialize() のボタンが画面の下半分に残るキーボードに覆われ、リストの先頭まで
# スクロールしてもその上へは出てこない（タップはキーボードに吸われる）。
- pressKey: Enter

# 登録ボタンはキーボードより上に来るまでスクロールしてから押す。
- scrollUntilVisible:
    element:
      id: 'btn-dict-add'
    direction: DOWN
    centerElement: true
    speed: 30
    timeout: 120000
- tapOn:
    id: 'btn-dict-add'
- runFlow: subflows/wait-idle.yaml
- assertVisible:
    id: 'status-text'
    text: '.*ユーザー辞書を更新しました（2 語）.*'
- scrollUntilVisible:
    element:
      id: 'dict-word-1'
    direction: DOWN
    centerElement: true
    speed: 30
    timeout: 120000
- assertVisible:
    id: 'dict-word-1'
    text: '.*VOICEVOX → シコクメタン（COMMON_NOUN.*優先度 6）.*'

# 辞書を入れた状態で初期化して合成できる。
- scrollUntilVisible:
    element:
      id: 'btn-initialize'
    direction: UP
    centerElement: true
    speed: 30
    timeout: 120000
- tapOn:
    id: 'btn-initialize'
- extendedWaitUntil:
    visible:
      id: 'status-text'
      text: '.*初期化が完了しました.*'
    timeout: 300000
- scrollUntilVisible:
    element:
      id: 'btn-synthesize-play'
    direction: DOWN
    centerElement: true
    speed: 30
    timeout: 120000
- tapOn:
    id: 'btn-synthesize-play'
- runFlow: subflows/wait-idle-long.yaml
- assertVisible:
    id: 'status-text'
    text: '.*合成しました: /.*\.wav.*'

# 全置換なので、消すたびに残りを丸ごと渡し直している。
- scrollUntilVisible:
    element:
      id: 'btn-dict-remove-0'
    direction: DOWN
    centerElement: true
    speed: 30
    timeout: 120000
- tapOn:
    id: 'btn-dict-remove-0'
- runFlow: subflows/wait-idle.yaml
- tapOn:
    id: 'btn-dict-remove-0'
- runFlow: subflows/wait-idle.yaml
- assertVisible:
    id: 'status-text'
    text: '.*ユーザー辞書を更新しました（0 語）.*'
