# 合成と再生。
#
# Maestro は音を聞けないので、鳴ったことは 3 つの手掛かりで確かめる。
#   1. speech-state … ネイティブの再生器が出すイベント（started / finished /
#      stopped / failed）。実際に再生が始まって正常に終わったことの直接の証拠。
#   2. status-text … 合成結果のパスや再生時間（durationMillis）。
#   3. status-error が出ていないこと。
appId: expo.modules.voicevox.example
name: 02-synthesis
tags:
  - smoke
  - core
---
- runFlow: subflows/initialize.yaml

# --- synthesis(): WAV をキャッシュへ書き、そのパスを expo-audio に渡す ---
- scrollUntilVisible:
    element:
      id: 'btn-synthesize-play'
    direction: DOWN
    centerElement: true
    speed: 30
    timeout: 120000
- tapOn:
    id: 'btn-synthesize-play'
- runFlow: subflows/wait-idle-long.yaml
- assertVisible:
    id: 'status-text'
    text: '.*合成しました: /.*\.wav.*'

# --- 書き出し先を document へ切り替えても書ける ---
- tapOn:
    id: 'dir-chip-document'
- tapOn:
    id: 'btn-synthesize-play'
- runFlow: subflows/wait-idle-long.yaml
- assertVisible:
    id: 'status-text'
    text: '.*合成しました: /.*\.wav.*'
- tapOn:
    id: 'dir-chip-cache'

# --- speak(): ファイルを作らず、メモリ上の WAV をネイティブでそのまま鳴らす ---
# speech-state は上部の固定ステータスバーにあるので、スクロール位置に関係なく見える。
#
# ここでは centerElement を付けない。対象がすでに画面に見えていると、centerElement は
# 寄せるためのスワイプを 1 回だけ入れて、慣性で行き過ぎても「見えている」ので完了扱いにする。
# iOS で btn-stop-speaking が y=597 → 111 まで飛び、2 つ上の btn-speak が固定ステータスバーの
# 裏（y=-6）に入った。Maestro はそれでも「見えている」と判断して画面最上端をタップし、
# iOS のステータスバータップ（先頭へスクロール）が発動して speak() が呼ばれなかった。
# centerElement が無ければ、見えている要素ではスクロールせず、下から現れる要素はスワイプ
# 1 回分の範囲（画面の下半分）で止まるので、固定ステータスバーの裏には入らない。
# btn-synthesize-play を押せた時点でそれより下にある btn-speak がヘッダーの裏にあることは無い。
- scrollUntilVisible:
    element:
      id: 'btn-speak'
    direction: DOWN
    speed: 30
    timeout: 120000
- tapOn:
    id: 'btn-speak'
- extendedWaitUntil:
    visible:
      id: 'status-text'
      text: '.*再生中 #\d+（\d+ms）.*'
    timeout: 180000
- assertVisible:
    id: 'speech-state'
    text: '.*#\d+ started.*'
# 鳴り終わりは busy の外で待っているので、UI は操作できる状態のまま遷移する。
- extendedWaitUntil:
    visible:
      id: 'speech-state'
      text: '.*#\d+ finished.*'
    timeout: 60000
- assertNotVisible:
    id: 'status-error'

# --- stopSpeaking(): 鳴っている最中に止める ---
# 停止ボタンは鳴らす前に画面へ入れておく（鳴っている間にスクロールすると、鳴り終わってから
# 押すことになりうる）。btn-speak は 1 つ上の段にあり、btn-stop-speaking が下から現れて
# 止まる位置（画面の下半分）からでも固定ステータスバーより下に収まる。
- scrollUntilVisible:
    element:
      id: 'btn-stop-speaking'
    direction: DOWN
    speed: 30
    timeout: 120000
- tapOn:
    id: 'btn-speak'
- extendedWaitUntil:
    visible:
      id: 'speech-state'
      text: '.*#\d+ started.*'
    timeout: 180000
- tapOn:
    id: 'btn-stop-speaking'
# 停止は status-text ではなく speech-state で見る。stopSpeaking() が書く
# 「停止しました」と waitForSpeech() が書く「#N stopped」は競合するので、
# status の最終値がどちらになるか決まらない。speech-state はイベントリスナしか
# 書かないので決定的。
- extendedWaitUntil:
    visible:
      id: 'speech-state'
      text: '.*#\d+ stopped.*'
    timeout: 15000

# --- AudioQuery を組み立てずに話速と頭出しを変える経路 ---
- runFlow: subflows/wait-idle-long.yaml
- tapOn:
    id: 'btn-speak-faster'
- extendedWaitUntil:
    visible:
      id: 'status-text'
      text: '.*speedScale 1\.1 / prePhonemeLength 0（合成 \d+ms ?/ ?再生 \d+ms）.*'
    timeout: 180000

# 一連の再生で failed が出ていないこと。
- assertNotVisible:
    id: 'speech-state'
    text: '.*failed.*'

- takeScreenshot: 02-synthesis
