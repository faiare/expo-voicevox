# finalize() で Synthesizer を捨てる。ユーザー辞書は次の initialize() のために残る。
appId: expo.modules.voicevox.example
name: 08-finalize
tags:
  - core
---
- runFlow: subflows/initialize.yaml

# 破棄する前にスタイルのチップが出ていることを確かめておく。これを見ずに
# 「消えた」を assert しても、単に画面の外にあるだけで通ってしまう。
- scrollUntilVisible:
    element:
      id: 'style-chip-3'
    direction: DOWN
    centerElement: true
    speed: 30
    timeout: 120000
- assertVisible:
    id: 'style-chip-3'

- scrollUntilVisible:
    element:
      id: 'btn-finalize'
    direction: UP
    centerElement: true
    speed: 30
    timeout: 120000
- tapOn:
    id: 'btn-finalize'
- runFlow: subflows/wait-idle.yaml
- assertVisible:
    id: 'status-text'
    text: '.*Synthesizer を破棄しました（辞書は残っています）.*'

- assertVisible:
    id: 'status-initialized'
    text: '初期化: いいえ'
- assertVisible:
    id: 'btn-finalize'
    enabled: false

# characters を空にしたのでスタイルのチップも消える。破棄の直前に見えていた
# 位置のままなので、消えたことがそのまま分かる。
- assertNotVisible:
    id: 'style-chip-3'

# 破棄したあともう一度初期化できる。
- tapOn:
    id: 'btn-initialize'
- extendedWaitUntil:
    visible:
      id: 'status-text'
      text: '.*初期化が完了しました.*'
    timeout: 300000
- assertVisible:
    id: 'status-initialized'
    text: '初期化: はい'
