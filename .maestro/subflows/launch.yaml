# アプリを起動し、操作できる状態になるまで待つ。
#
# clearState は付けない。Android では端末へ展開済みのモデル・辞書まで消えて、
# 次の初期化で 130MB の展開をやり直すことになるため。
appId: expo.modules.voicevox.example
---
- launchApp

# iOS のコールドブート対策。最初の描画が終わる前にアクセシビリティツリーへ
# 触ると XCTest ドライバが kAXErrorInvalidUIElement で落ちることがある。
- swipe:
    direction: DOWN
    duration: 100

# getVersion() が通ったこと（= ネイティブライブラリのリンクとロードに成功した
# こと）をレディネスの判定にする。「（未取得）」のままなら、そこで落ちている。
# Debug ビルドは Metro からバンドルを取るぶん起動が遅いので長めに待つ。
#
# CI のエミュレータでは、hide_error_dialogs を立てていても「Pixel Launcher isn't
# responding」の ANR ダイアログがまれに最前面へ出る。出ているあいだ Maestro には
# ダイアログのウィンドウしか見えず、アプリが正常に起動していても lib-version を
# 見つけられない。そこで 1 回にまとめて待たず、10 秒ずつ最大 12 回（計 120 秒）に
# 分けて、各回の頭でダイアログが出ていれば「Close app」で閉じる。
#
# - 「Wait」では直らない。詰まったままのプロセスに対しては 5 秒ほどで同じダイアログが
#   出し直される（ランチャーを SIGSTOP した API 34 のエミュレータで 12 回とも再表示された）。
#   「Close app」なら詰まったプロセスが終わり、システムがランチャーを起動し直す。
# - ボタンは文言ではなく AOSP の app_anr_dialog.xml の ID で引く。言語に依存しない。
# - テスト対象のアプリ自身の ANR は閉じない。閉じると本物の不具合を隠すので、
#   タイトルにアプリ名が出ているときは触らず、そのまま待ちの時間切れで落とす。
# - iOS では一致しないので何もしない。
- repeat:
    times: 12
    while:
      notVisible:
        id: 'lib-version'
        text: '.*\d+\.\d+\.\d+.*'
    commands:
      - runFlow:
          when:
            visible:
              id: 'android:id/aerr_close'
            notVisible:
              id: 'android:id/alertTitle'
              text: '.*expo-voicevox-example.*'
          commands:
            - tapOn:
                id: 'android:id/aerr_close'
      - extendedWaitUntil:
          visible:
            id: 'lib-version'
            text: '.*\d+\.\d+\.\d+.*'
          timeout: 10000
          optional: true

# ループを使い切っても見えなければ、ここで従来どおりの理由で落とす。
- assertVisible:
    id: 'lib-version'
    text: '.*\d+\.\d+\.\d+.*'

- assertVisible:
    id: 'status-busy'
    text: 'IDLE'
